<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <meta name="robots" content="noindex, nofollow">
    <title>Correo confirmado | Amazon Creator Assistant</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17212b;
        background: #f7f8fa;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 460px);
        padding: 44px 40px 40px;
        text-align: center;
        background: #fff;
        border: 1px solid #e7eaee;
        border-radius: 18px;
        box-shadow: 0 12px 36px rgb(23 33 43 / 7%);
      }

      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        color: #087f5b;
        background: #e8f6f1;
        border-radius: 50%;
      }

      .brand {
        margin: 0 0 12px;
        color: #56616d;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 6vw, 32px);
        line-height: 1.2;
        letter-spacing: -.035em;
      }

      .message {
        margin: 16px 0 0;
        color: #596572;
        font-size: 16px;
        line-height: 1.65;
      }

      .next-step {
        margin: 28px 0 0;
        padding: 16px 18px;
        color: #34404b;
        background: #f5f7f9;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.6;
      }

      .next-step strong { color: #17212b; }

      @media (max-width: 480px) {
        main { padding: 36px 24px 28px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
          <path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <p class="brand">Amazon Creator Assistant</p>
      <h1>Correo confirmado</h1>
      <p class="message">Tu dirección de correo electrónico se confirmó correctamente.</p>
      <p class="next-step"><strong>Ya puedes volver a la extensión</strong> e iniciar sesión con tu email y contraseña.</p>
    </main>
    <script>
      // Supabase puede devolver tokens de sesión en el fragmento de la URL.
      // Esta página solo confirma el resultado y no necesita conservarlos.
      if (window.location.hash) {
        window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
      }
    </script>
  </body>
</html>
